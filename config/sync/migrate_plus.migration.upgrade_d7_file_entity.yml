uuid: 319e6173-21ae-40c1-a232-a91d7dece6f3
langcode: en
status: true
dependencies:
  enforced:
    module:
      - mez_d7_migrate
id: upgrade_d7_file_entity
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'File Entity to Media'
source:
  plugin: d7_file_entity_item
  constants:
    display: 1
process:
  bundle:
    plugin: mez_media_bundle
  name: filename
  uid:
    -
      plugin: migration_lookup
      migration: upgrade_d7_user
      source: uid
      no_stub: true
    -
      plugin: default_value
      default_value: 1
  status: status
  created: timestamp
  changed: timestamp
  field_title:
    -
      plugin: mez_skip_unless_bundle
      bundle: remote_video
    -
      plugin: get
      source: filename
  field_media_oembed_video:
    -
      plugin: mez_skip_unless_bundle
      bundle: remote_video
    -
      plugin: mez_youtube_uri_to_oembed
      source: uri
  field_media_image/target_id:
    -
      plugin: mez_skip_unless_bundle_in
      bundles:
        - image
        - image_private
    -
      plugin: mez_skip_youtube_file
    -
      plugin: migration_lookup
      migration:
        - upgrade_d7_file
      source: fid
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
  field_media_image/alt:
    -
      plugin: mez_skip_unless_bundle_in
      bundles:
        - image
        - image_private
    -
      plugin: mez_field_value
      source: field_file_image_alt_text
      key: value
  field_media_image/title:
    -
      plugin: mez_skip_unless_bundle_in
      bundles:
        - image
        - image_private
    -
      plugin: mez_field_value
      source: field_file_image_title_text
      key: value
  field_media_audio_file/target_id:
    -
      plugin: mez_skip_unless_bundle
      bundle: sound
    -
      plugin: mez_skip_youtube_file
    -
      plugin: migration_lookup
      migration:
        - upgrade_d7_file
      source: fid
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
  field_media_audio_file/display:
    -
      plugin: mez_skip_unless_bundle
      bundle: sound
    -
      plugin: get
      source: constants/display
  field_media_audio_file/description:
    -
      plugin: mez_skip_unless_bundle
      bundle: sound
    -
      plugin: mez_field_value
      source: description_field
      key: value
  field_media_file/target_id:
    -
      plugin: mez_skip_unless_bundle
      bundle: file
    -
      plugin: mez_skip_youtube_file
    -
      plugin: migration_lookup
      migration:
        - upgrade_d7_file
      source: fid
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
  field_description/value:
    -
      plugin: mez_field_value
      source: description_field
      key: value
    -
      plugin: skip_on_empty
      method: process
  field_description/format:
    plugin: default_value
    default_value: ckeditor
  field_date/value:
    -
      plugin: mez_field_value
      source: field_day_date
      key: value
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: format_date
      from_format: 'Y-m-d H:i:s'
      to_format: Y-m-d
      from_timezone: UTC
      to_timezone: UTC
  field_location/target_id:
    -
      plugin: mez_field_value
      source: field_location_reference
      key: target_id
    -
      plugin: mez_migration_lookup_or_skip
      migration: upgrade_d7_node_complete_location
  field_pieces:
    -
      plugin: sub_process
      source: field_piece
      process:
        target_id:
          -
            plugin: get
            source: target_id
          -
            plugin: mez_migration_lookup_or_skip
            migration: upgrade_d7_node_complete_piece
          -
            plugin: skip_on_empty
            method: row
    -
      plugin: skip_on_empty
      method: process
  field_tags:
    -
      plugin: sub_process
      source: field_tags
      process:
        target_id:
          -
            plugin: get
            source: tid
          -
            plugin: mez_migration_lookup_or_skip
            migration: upgrade_d7_taxonomy_term_media
          -
            plugin: skip_on_empty
            method: row
    -
      plugin: skip_on_empty
      method: process
destination:
  plugin: 'entity:media'
idMap: {  }
migration_dependencies:
  required:
    - upgrade_d7_file
    - upgrade_d7_user
  optional:
    - upgrade_d7_node_complete_location
    - upgrade_d7_node_complete_piece
    - upgrade_d7_taxonomy_term_media
include: null
