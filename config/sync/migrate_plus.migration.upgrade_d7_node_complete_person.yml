uuid: 2fb7fcbd-b88d-4a15-b0ec-fb6f843cf2a6
langcode: hu
status: true
dependencies: {}
id: upgrade_d7_node_complete_person
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - "Drupal 7"
  - Content
migration_group: migrate_drupal_7
label: "Node complete (Person)"
source:
  plugin: d7_node
  node_type: person
process:
  nid:
    - plugin: get
      source: tnid
  vid:
    - plugin: get
      source: vid
  langcode:
    - plugin: default_value
      source: language
      default_value: und
  title: title
  uid:
    - plugin: get
      source: node_uid
  status:
    - plugin: get
      source: status
  created:
    - plugin: get
      source: created
  changed:
    - plugin: get
      source: changed
  promote:
    - plugin: get
      source: promote
  sticky:
    - plugin: get
      source: sticky
  revision_uid:
    - plugin: get
      source: revision_uid
  revision_log:
    - plugin: get
      source: log
  revision_timestamp:
    - plugin: get
      source: timestamp
  field_active:
    - plugin: get
      source: field_active
  field_email:
    - plugin: sub_process
      source: field_email
      process:
        value: email
  field_email_list:
    - plugin: get
      source: field_email_list
  field_image:
    - plugin: sub_process
      source: field_image
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
  field_instrument:
    - plugin: migration_lookup
      migration: upgrade_d7_taxonomy_term_instruments
      source: field_instrument
  field_member:
    - plugin: get
      source: field_member
  field_membership_dates:
    - plugin: sub_process
      source: field_membership_dates
      process:
        value:
          plugin: format_date
          from_format: "Y-m-d H:i:s"
          to_format: Y-m-d
          source: value
        end_value:
          plugin: format_date
          from_format: "Y-m-d H:i:s"
          to_format: Y-m-d
          source: value2
  field_neptun_code:
    - plugin: get
      source: field_neptun_code
  field_occupation:
    - plugin: get
      source: field_occupation
  field_address:
    - plugin: location_to_address
      source: field_person_address
  field_phone:
    - plugin: get
      source: field_phone
  body/value: field_person_body/0/value
  body/format:
    - plugin: static_map
      source: field_person_body/0/format
      map:
        wysiwyg: ckeditor
        plain_text: plain_text
      default_value: plain_text
  field_positions:
    - plugin: sub_process
      source: field_positions
      process:
        target_id:
          - plugin: paragraphs_lookup
            tags: "Field Collection Content"
            source: value
          - plugin: extract
            index:
              - id
        target_revision_id:
          - plugin: paragraphs_lookup
            tags:
              - "Field Collection Revisions Content"
              - "Field Collection Content"
            tag_ids:
              "Field Collection Revisions Content":
                - revision_id
              "Field Collection Content":
                - value
          - plugin: extract
            index:
              - revision_id
  field_date_of_birth:
    - plugin: sub_process
      source: field_date_of_birth
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d\TH:i:s'
          to_format: Y-m-d
          source: value
  field_public_description/value: field_public_description/0/value
  field_public_description/format:
    plugin: default_value
    default_value: ckeditor
  field_studies:
    - plugin: get
      source: field_studies
  field_student_status:
    - plugin: sub_process
      source: field_student_status
      process:
        target_id:
          plugin: migration_lookup
          migration: upgrade_d7_taxonomy_term_student_status
          source: target_id
  field_data_confirmed:
    - plugin: get
      source: field_data_confirmed
  field_place_of_birth:
    - plugin: get
      source: field_place_of_birth
  field_years_of_study:
    - plugin: sub_process
      source: field_years_of_study
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d\TH:i:s'
          to_format: Y-m-d
          source: value
        end_value:
          plugin: format_date
          from_format: 'Y-m-d\TH:i:s'
          to_format: Y-m-d
          source: value2
destination:
  plugin: "entity:node"
  translations: true
  default_bundle: person
idMap: {}
migration_dependencies:
  required:
    - upgrade_d7_user
    - upgrade_d7_field_collection_positions
    - upgrade_d7_field_collection_revisions_positions
    - upgrade_d7_taxonomy_term_instruments
    - upgrade_d7_taxonomy_term_student_status
  optional: {}
include: null
